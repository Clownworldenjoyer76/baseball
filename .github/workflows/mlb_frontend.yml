name: Export MLB Frontend CSV

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Create frontend CSV files
        run: python docs/win/baseball/mlb/scripts/frontend.py

      - name: Commit and push frontend CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/data/mlb/*.csv
          git diff --cached --quiet || git commit -m "Update MLB frontend CSV"
          git push origin HEAD:main
