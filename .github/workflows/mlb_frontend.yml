
name: Export MLB Frontend JSON

on:
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY_MM_DD (blank = today in Eastern time)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Create frontend JSON
        run: python docs/win/baseball/mlb/scripts/frontend.py --date "${{ inputs.date }}"

      - name: Commit and push frontend JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/data/mlb/
          git diff --cached --quiet || git commit -m "Update MLB frontend JSON"
          git push origin HEAD:main
