
name: Qodana

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

jobs:
  qodana:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            docs/win/baseball/mlb/requirements.txt
            docs/win/baseball/mlb/vendor/sportsdataverse/pyproject.toml

      - name: Install Qodana Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/win/baseball/mlb/requirements.txt
          python -m pip install docs/win/baseball/mlb/vendor/sportsdataverse -c docs/win/baseball/mlb/requirements.txt
          python -m pip check
          python -c "from sportsdataverse.mlb import mlb_statcast_search; assert callable(mlb_statcast_search)"
          echo "SPORTSDATAVERSE_IMPORT: PASS"

      - name: Select Qodana Python interpreter
        shell: bash
        run: echo "QODANA_PYTHON_PATH=$(command -v python)" >> "$GITHUB_ENV"

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: |
            --linter qodana-python-community
            --within-docker false
          pr-mode: false
          push-fixes: none
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_45770816 }}
          QODANA_ENDPOINT: https://qodana.cloud
