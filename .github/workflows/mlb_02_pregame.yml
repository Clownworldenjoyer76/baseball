name: MLB 02 Pregame Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  MLB_Afternoon_Update:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Create isolated MLB Python environment
        run: |
          python -m venv .venv-mlb
          echo "$GITHUB_WORKSPACE/.venv-mlb/bin" >> "$GITHUB_PATH"

      - name: Install MLB dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/win/baseball/mlb/requirements.txt
          python -m pip install playwright

      - name: Install vendored SportsDataverse
        run: python -m pip install -e docs/win/baseball/mlb/vendor/sportsdataverse -c docs/win/baseball/mlb/requirements.txt

      - name: Verify MLB Python dependency consistency
        run: python -m pip check

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: MLB Updated Odds Pull
        run: python docs/win/baseball/mlb/scripts/00_parsing/odds_mlb_update.py

      - name: MLB Odds Parse
        run: |
          TARGET_DATE="$(TZ='America/New_York' date +'%Y_%m_%d')"
          ODDS_FILE="docs/win/baseball/mlb/odds/latest/${TARGET_DATE}.json"
          test -f "${ODDS_FILE}"
          python docs/win/baseball/mlb/scripts/00_intake/odds_parse.py "${ODDS_FILE}"

      - name: MLB Name Normalization Pre
        run: python docs/win/baseball/mlb/scripts/00_intake/name_normalization.py

      - name: MLB DRAT Scraper
        run: python docs/win/baseball/mlb/scripts/00_intake/baseball_drat_scraper.py

      - name: MLB Transform Baseball
        run: python docs/win/baseball/mlb/scripts/00_intake/transform_baseball.py

      - name: MLB Name Normalization Post
        run: python docs/win/baseball/mlb/scripts/00_intake/name_normalization.py

      - name: MLB Scrape Raw
        run: python docs/win/baseball/mlb/scripts/00_intake/scrape_mlb_raw.py

      - name: MLB Build Games List
        run: python docs/win/baseball/mlb/scripts/00_intake/build_games_list.py

      - name: MLB SportsDataverse Features
        run: python docs/win/baseball/mlb/scripts/00_intake/sportsdataverse_mlb.py

      - name: MLB Fetch Park Weather
        run: python docs/win/baseball/mlb/scripts/00_intake/fetch_park_weather.py

      - name: MLB Build Game Weather
        run: python docs/win/baseball/mlb/scripts/00_intake/build_game_weather.py

      - name: MLB Enrich Game Context
        run: python docs/win/baseball/mlb/scripts/00_intake/enrich_game_context.py

      - name: MLB Game ID Predictions
        run: python docs/win/baseball/mlb/scripts/00_intake/game_id_pred.py

      - name: MLB Build Run Projection
        run: python docs/win/baseball/mlb/scripts/00_intake/brp_pregame.py

      - name: MLB Merge Intake
        run: python docs/win/baseball/mlb/scripts/01_merge/merge_intake.py

      - name: MLB Build Juice Files
        run: python docs/win/baseball/mlb/scripts/01_merge/build_juice_files.py

      - name: MLB Compute Edges
        run: python docs/win/baseball/mlb/scripts/03_edges/compute_edges.py

      - name: MLB Compute EV Kelly
        run: python docs/win/baseball/mlb/scripts/03_edges/compute_ev_kelly.py

      - name: MLB Select Bets
        run: python docs/win/baseball/mlb/scripts/04_select/baseball_select_bets.py

      - name: Check for selected bet files
        id: selected_bets
        shell: bash
        run: |
          if find docs/win/baseball/mlb/04_select \
            -maxdepth 1 \
            -type f \
            ! -name ".gitkeep" \
            | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Selected-bet files found."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No selected-bet files found. Skipping grading, reports, and dashboard generation."
          fi

      - name: MLB Normalize Results
        if: steps.selected_bets.outputs.found == 'true'
        run: python docs/win/baseball/mlb/scripts/05_final_scores/normalize_mlb_results.py

      - name: MLB Grade Results
        id: grade_results
        if: steps.selected_bets.outputs.found == 'true'
        continue-on-error: true
        run: python docs/win/baseball/mlb/scripts/05_final_scores/01_mlb_results_grade.py

      - name: MLB Analyze Results
        if: steps.selected_bets.outputs.found == 'true' && steps.grade_results.outcome == 'success'
        run: python docs/win/baseball/mlb/scripts/05_final_scores/02_mlb_results_analyze.py

      - name: MLB Build Results Reports
        if: steps.selected_bets.outputs.found == 'true' && steps.grade_results.outcome == 'success'
        run: python docs/win/baseball/mlb/scripts/05_final_scores/03_mlb_results_reports.py

      - name: MLB Build Results Dashboard
        if: steps.selected_bets.outputs.found == 'true' && steps.grade_results.outcome == 'success'
        run: python docs/win/baseball/mlb/scripts/05_final_scores/04_mlb_results_dashboard.py

      - name: MLB Pipeline Health
        if: always()
        env:
          MLB_PIPELINE_WORKFLOW: pregame
          MLB_PIPELINE_JOB_STATUS: ${{ job.status }}
        run: python docs/win/baseball/mlb/scripts/pipeline_health.py

      - name: Commit MLB outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/win/baseball/mlb/
          git add frontend/data/dashboards/baseball.json

          git restore --staged docs/win/baseball/mlb/audit/leakage_audit.csv 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No MLB output changes to commit."
          else
            git commit -m "chore: update MLB pregame pipeline outputs"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Commit MLB pipeline health frontend
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/win/baseball/mlb/pipeline_health.json
          git add frontend/data/pipeline_health/mlb.json

          if git diff --cached --quiet; then
            echo "No MLB pipeline health changes to commit."
          else
            git commit -m "chore: update MLB pipeline health"
            git pull --rebase --autostash origin main
            git push origin main
          fi
